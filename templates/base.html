{% load static %}
<!doctype html>
<html lang="en">
  	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>{% block title_tag %}{% endblock %} | Estimator</title>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
		<link rel="stylesheet" href="{% static 'css/themes/bootstrap-pulse/bootstrap.min.css' %}" />
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
		<script src="{% static 'js/nav.js' %}"></script>
		<link rel="stylesheet" href="{% static 'css/styles.css' %}" />
		{% block extra_header %}{% endblock %}
	</head>

	<body>
		<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
			<div class="container container-fluid">
				<a class="navbar-brand" href="{% url 'home' %}">Estimator</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarColor02">
				<ul class="navbar-nav me-auto">
					<li class="nav-item">
					<a class="nav-link active" href="{% url 'home' %}">Home
						<span class="visually-hidden">(current)</span>
					</a>
					</li>
					<li class="nav-item">
					<a class="nav-link" href="{% url 'appuser:user_profile' %}">Profile</a>
					</li>
				</ul>
				</div>
			</div>
		</nav>
		<div class="container">
			<div class="body">
				{% block page_content %}{% endblock %}
			</div>
		</div>
	</body>
	<footer>
		<div class="container">
			<div class="row">
				<div class="col">
				</div>
			</div>
		</div>
	</footer>
</html>
