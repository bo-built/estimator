<tr x-show="editItem != item">
    <td x-text="item.name"></td>
    <td x-text="item.sku"></td>
    <td x-text="item.description"></td>
    <td x-text="new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(item.cost_rate)"></td>
    <td x-text="item.charge_multiplier"></td>
    <td x-text="new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(item.charge_rate)"></td>
    <td><button class="btn btn-primary btn-sm" @click="setEditItem(item)">edit</button></td>
</tr>
<tr x-show="editItem == item">
    <td><input type="text" class="form-control"
        :class="{ 'is-invalid': !editDraft.name?.trim() || nameIsDuplicate() }" x-model="editDraft.name" required/>
        <div class="text-danger" x-show="nameIsDuplicate()"><em>Duplicate Name</em></div>
    </td>
    <td><input type="text" class="form-control"
        :class="{ 'is-invalid': !editDraft.sku?.trim() || skuIsDuplicate() }" x-model="editDraft.sku" required/>
        <div class="text-danger" x-show="skuIsDuplicate()"><em>Duplicate SKU</em></div>
    </td>
    <td><input type="text" class="form-control" x-model="editDraft.description" /></td>
    <td><input type="number" class="form-control"
        :class="{ 'is-invalid': !editDraft.cost_rate?.trim() }" x-model.number="editDraft.cost_rate" step="0.01" required @change="updateEditDraftChargeRate()" /></td>
    <td><input type="number" class="form-control"
        :class="{ 'is-invalid': !editDraft.charge_multiplier?.trim() }" x-model="editDraft.charge_multiplier" step="0.01" required @change="updateEditDraftChargeRate()" /></td>
    <td x-text="new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(editDraft.charge_rate)"></td>
    <td>
        <button class="btn btn-success btn-sm" type="submit" @click="saveEditItem(item)">save</button>
    </td>
    <td>
        <button class="btn btn-primary btn-sm" @click="cancelEditItem(item)" type="button">cancel</button>
    </td>

</tr>
